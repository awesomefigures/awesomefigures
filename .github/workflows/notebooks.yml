name: refresh notebooks and site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: notebook-refresh-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and notebook dependencies
        run: python -m pip install -e ".[docs]"

      - name: Execute all notebooks and save outputs
        run: python tools/execute_notebooks.py

      - name: Commit refreshed notebook outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source/notebooks/*.ipynb
          if git diff --cached --quiet; then
            echo "Notebook outputs are already current."
          else
            git commit -m "Refresh executed notebook outputs"
            git push
          fi

      - name: Build Sphinx from stored notebook outputs
        env:
          AWESOMEFIGURES_NB_EXECUTION: "off"
        run: sphinx-build -W -b html docs/source docs/_build/html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: refresh
    runs-on: ubuntu-latest
    steps:
      - name: Deploy refreshed documentation
        id: deployment
        uses: actions/deploy-pages@v5
