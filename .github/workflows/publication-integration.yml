name: exact TeX publication integration

on:
  push:
    branches: [feature/automatic-publication-workflow]
  pull_request:
    paths:
      - "src/awesomefigures/**"
      - "tests/test_auto_publication.py"
      - "examples/automatic_publication/**"
      - "pyproject.toml"
      - ".github/workflows/publication-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tex-and-pdf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      AWESOMEFIGURES_NB_EXECUTION: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual TeX Live, PGF, preview and journal fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern poppler-utils
          command -v pdflatex
          kpsewhich preview.sty
          kpsewhich pgf.sty
      - name: Install package and PDF inspection
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,publication]"
      - name: Real TeX, PDF MediaBox, font and cache tests
        run: python -m pytest -q tests/test_auto_publication.py tests/test_publication.py
      - name: Batch example with exact PDF fonts
        run: |
          python examples/automatic_publication/render.py --tex examples/automatic_publication/two_column.tex --output examples/automatic_publication/generated
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("examples/automatic_publication/generated")
          m = json.loads((root / "manifest.json").read_text())
          assert m["all_passed"] and m["figure_count"] == 4
          assert all(x["pdf_fonts"] for x in m["figures"] if x["format"] == "pdf")
          assert all(x["typography"] == "exact-tex-preamble" for x in m["figures"] if x["format"] == "pdf")
          assert all(all(y["embedded"] for y in x["pdf_fonts"]) for x in m["figures"] if x["format"] == "pdf")
          print("Verified exact TeX PDF font embedding and physical dimensions")
          PY
      - name: Upload technical verification outputs
        uses: actions/upload-artifact@v4
        with:
          name: exp001-publication-validation
          path: |
            examples/automatic_publication/generated/*.pdf
            examples/automatic_publication/generated/*.pgf
            examples/automatic_publication/generated/*.json
            examples/automatic_publication/generated/*.md
          retention-days: 90
