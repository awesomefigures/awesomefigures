name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: node tools/test_studio_smoke.js
      # Validate the artifact users actually install, not just the editable tree.
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip uninstall -y awesomefigures
      - run: python -m pip install --no-deps dist/awesomefigures-*.whl
      - run: python -c "import awesomefigures as af; from importlib.metadata import version; assert af.__version__ == version('awesomefigures'); assert 'elegante' in af.available_styles(); assert af.named_palette('okabe-ito', n=3)"
