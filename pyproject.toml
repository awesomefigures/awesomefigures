[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesomefigures"
version = "0.1.0"
description = "Scientific figures, accessible palettes, and publication-ready Matplotlib styles."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Heriberto Espino Montelongo" }
]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
  "colorspacious>=1.1.2",
]
keywords = ["scientific-figures", "matplotlib", "visualization", "colorblind", "latex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/heri-espino/Colors"
Documentation = "https://heri-espino.github.io/Colors/"
Source = "https://github.com/heri-espino/Colors"
Issues = "https://github.com/heri-espino/Colors/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.22,<0.24",
  "sphinx-design>=0.6",
  "myst-nb>=1.1",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "ipykernel>=6",
]
notebooks = ["jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
